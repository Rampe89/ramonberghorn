<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ramon Berghorn — Informatik & CyberDefense Lab</title>
  <meta name="description" content="CyberDefense Lab, Unterrichtsbeispiele, schulinterner Lehrplan und Lernbuddy Informatik."/>

  <style>
    :root{
      --bg:#f6f4ef;
      --paper:#fffdf8;
      --ink:#111;
      --muted:#2f2f2f;
      --line:#111;

      --hi:#ff3b30;
      --hi2:#0057ff;
      --hi3:#00c853;

      --max: 1120px;
      --pad: 18px;
      --gap: 14px;
      --bw: 2px;

      --shadowInk: rgba(17,17,17,.95);
      --shadow: 10px 10px 0 var(--shadowInk);
      --shadow2: 6px 6px 0 var(--shadowInk);

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

      --termBg:#070707;
      --termPanel:#0f0f0f;
      --termText:#e9e9e9;
      --termAccent:#7dd3fc;
      --termOk:#86efac;
      --termWarn:#ff7a70;
      --termGlow: rgba(134,239,172,.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--ink);
      background:
        linear-gradient(0deg, rgba(0,0,0,.05) 1px, transparent 1px) 0 0/ 22px 22px,
        linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px) 0 0/ 22px 22px,
        var(--bg);
    }
    a{ color:inherit; }
    .wrap{ max-width: var(--max); margin:0 auto; padding: 0 var(--pad); }

    /* Top strip */
    .strip{
      background: var(--ink);
      color: var(--paper);
      border-bottom: var(--bw) solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing:.06em;
    }
    .strip .wrap{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px var(--pad);
    }
    .strip b{ font-weight:800; }
    .strip span{ opacity:.85; }

    /* Header */
    header{
      position:sticky;
      top:0;
      z-index:50;
      background: rgba(246,244,239,.92);
      backdrop-filter: blur(6px);
      border-bottom: var(--bw) solid var(--line);
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 0;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width: 260px;
    }
    .mark{
      width:44px;height:44px;
      border: var(--bw) solid var(--line);
      background: var(--paper);
      display:grid;
      place-items:center;
      font-weight:900;
      user-select:none;
      box-shadow: var(--shadow2);
    }
    .brandText b{
      display:block;
      font-weight:900;
      letter-spacing:.01em;
      font-size: 14px;
      text-transform:uppercase;
    }
    .brandText span{
      display:block;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--muted);
      margin-top:2px;
    }
    .menu{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    .tab{
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      border: var(--bw) solid var(--line);
      background: var(--paper);
      text-decoration:none;
      box-shadow: 4px 4px 0 var(--shadowInk);
      transition: transform .12s ease;
      text-transform:uppercase;
      letter-spacing:.06em;
      white-space:nowrap;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .tab:hover{ transform: translate(-2px, -2px); }

    main{ padding: 18px 0 34px; }

    /* Single column hero block */
    .panel{
      border: var(--bw) solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .heroTop{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }
    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing:.10em;
      padding: 8px 10px;
      border: var(--bw) solid var(--line);
      background: #fff;
      box-shadow: 4px 4px 0 var(--shadowInk);
    }
    .dot{
      width:10px;height:10px;
      background: var(--hi3);
      border: var(--bw) solid var(--line);
    }
    h1{
      margin: 6px 0 0;
      font-size: clamp(30px, 3.6vw, 54px);
      line-height:1.0;
      letter-spacing:-0.03em;
      font-weight: 900;
      text-transform:uppercase;
    }

    /* Big video */
    .videoFrame{
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding: 10px;
    }
    .videoHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      flex-wrap:wrap;
    }
    .videoBtn{
      border: var(--bw) solid var(--line);
      padding: 4px 8px;
      box-shadow: 3px 3px 0 var(--shadowInk);
      background: #fff;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      cursor:pointer;
      white-space:nowrap;
    }
    .videoWrap{
      position:relative;
      width:100%;
      aspect-ratio: 16 / 9;
      border: var(--bw) solid var(--line);
      box-shadow: 4px 4px 0 var(--shadowInk);
      overflow:hidden;
      background:#000;
    }
    .videoWrap video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      background:#000;
    }

    /* Console */
    .consolePanel{
      margin-top: 14px;
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding: 10px;
    }
    .termTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .miniHelp{
      font-family: var(--mono);
      font-size: 12px;
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: 3px 3px 0 var(--shadowInk);
      padding: 6px 8px;
      white-space:nowrap;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .termBox{
      border: var(--bw) solid var(--line);
      box-shadow: 4px 4px 0 var(--shadowInk);
      background: var(--termBg);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 280px;
      position:relative;
    }
    /* subtle CRT */
    .termBox::before{
      content:"";
      position:absolute; inset:0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.05) 0px,
        rgba(255,255,255,.05) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 7px
      );
      opacity:.18;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    .termBox::after{
      content:"";
      position:absolute; inset:-40px;
      background: radial-gradient(closest-side, rgba(134,239,172,.10), transparent 62%);
      opacity:.55;
      pointer-events:none;
    }
    .termOut{
      padding: 12px;
      color: var(--termText);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      white-space:pre-wrap;
      flex:1;
      overflow:auto;
      position:relative;
      text-shadow: 0 0 14px var(--termGlow);
    }
    .termOut .accent{ color: var(--termAccent); font-weight:700; }
    .termOut .ok{ color: var(--termOk); font-weight:800; }
    .termOut .warn{ color: var(--termWarn); font-weight:800; }
    .termOut .pix{
      display:block;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: .03em;
      color:#c7ffdf;
      opacity:.95;
      margin: 0 0 8px;
    }
    .termInRow{
      display:flex;
      gap:8px;
      padding: 12px;
      border-top: 2px solid #111;
      background: var(--termPanel);
      align-items:center;
    }
    .prompt{
      color: var(--termOk);
      font-family: var(--mono);
      font-size: 12px;
      white-space:nowrap;
    }
    .termIn{
      flex:1;
      border: 2px solid #111;
      background:#fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 8px;
    }

    @media (prefers-reduced-motion: reduce){
      .tab{ transition:none; }
      .tab:hover{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="strip" aria-hidden="true">
    <div class="wrap">
      <div><b>RB</b> / Informatik Sek I / CyberDefense Lab</div>
      <div><span>BUILD:</span> <b>2025-12-29</b></div>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="nav">
        <div class="brand">
          <div class="mark" aria-hidden="true">RB</div>
          <div class="brandText">
            <b>Ramon Berghorn</b>
            <span>Informatik Sek I · CyberDefense Lab</span>
          </div>
        </div>

        <nav class="menu" aria-label="Hauptnavigation">
          <a class="tab" href="/students/index.html">Students</a>
          <a class="tab" href="/colleagues/index.html">Colleagues</a>
          <a class="tab" href="/cyber/index.html">Cyber</a>
          <a class="tab" href="/events/index.html">Events</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">

      <section class="panel" aria-label="Landing">
        <div class="heroTop">
          <div class="kicker"><span class="dot"></span><span>unterricht · informatik · praxis</span></div>
          <h1>Informatik, die wirkt.</h1>
        </div>

        <!-- BIG HERO VIDEO (full width) -->
        <div class="videoFrame" aria-label="Hero Video">
          <div class="videoHead">
            <div>Hero Video</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <button class="videoBtn" id="vidToggle" type="button">Pause</button>
              <button class="videoBtn" id="muteToggle" type="button">Unmute</button>
            </div>
          </div>
          <div class="videoWrap">
            <video autoplay controls id="heroVideo" loop muted playsinline poster="/assets/video/hero-poster.jpg" preload="metadata">
              <source src="/assets/video/hero.webm" type="video/webm"/>
              <source src="/assets/video/hero.mp4" type="video/mp4"/>
              Dein Browser unterstützt das Video-Tag nicht.
            </video>
          </div>
        </div>

        <!-- CONSOLE below video (full width) -->
        <div class="consolePanel" aria-label="Console">
          <div class="termTop">
            <div>console</div>
            <button class="miniHelp" id="miniHelp" type="button">$ help</button>
          </div>

          <div class="termBox" role="region" aria-label="Terminal">
            <div class="termOut" id="shellOut"></div>
            <form class="termInRow" id="shellForm">
              <span class="prompt" id="promptText">ramon@school-lab:~$</span>
              <input class="termIn" id="shellIn" type="text" autocomplete="off" spellcheck="false"
                     placeholder="ls · cd students · help" aria-label="Terminal Eingabe"/>
            </form>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // Video controls
    (function(){
      const v = document.getElementById("heroVideo");
      const btnPlay = document.getElementById("vidToggle");
      const btnMute = document.getElementById("muteToggle");
      if(!v) return;

      const sync = () => {
        if(btnMute) btnMute.textContent = v.muted ? "Unmute" : "Mute";
        if(btnPlay) btnPlay.textContent = v.paused ? "Play" : "Pause";
      };

      const tryPlay = () => {
        const p = v.play();
        if(p && typeof p.catch === "function") p.catch(() => {});
      };

      btnPlay?.addEventListener("click", () => { v.paused ? tryPlay() : v.pause(); sync(); });
      btnMute?.addEventListener("click", () => { v.muted = !v.muted; if(!v.muted && v.paused) tryPlay(); sync(); });

      v.addEventListener("play", sync);
      v.addEventListener("pause", sync);
      v.addEventListener("volumechange", sync);
      window.addEventListener("load", () => { tryPlay(); sync(); });
      document.addEventListener("visibilitychange", () => { if(!document.hidden) tryPlay(); });
    })();

    // Terminal
    (() => {
      const out = document.getElementById("shellOut");
      const form = document.getElementById("shellForm");
      const input = document.getElementById("shellIn");
      const promptText = document.getElementById("promptText");
      const miniHelp = document.getElementById("miniHelp");
      if(!out || !form || !input || !promptText) return;

      const routes = {
        students: "/students/index.html",
        colleagues: "/colleagues/index.html",
        cyber: "/cyber/index.html",
        events: "/events/index.html"
      };
      const state = { cwd: "/" };

      const esc = (s) => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
      const line = (html="") => { out.innerHTML += html + "<br>"; out.scrollTop = out.scrollHeight; };
      const hr = () => line(`<span class="accent">${"—".repeat(56)}</span>`);

      const setPrompt = () => {
        const where = state.cwd === "/" ? "~" : state.cwd;
        promptText.textContent = `ramon@school-lab:${where}$`;
      };

      const header = () => {
        line(`<span class="pix">┌─ rb-shell ───────────────────────────────┐</span>`);
        line(`<span class="pix">│ dirs: students · colleagues · cyber · events │</span>`);
        line(`<span class="pix">└───────────────────────────────────────────┘</span>`);
      };

      const motd = () => {
        out.innerHTML = "";
        header();
        line(`<span class="ok">OK</span> <span class="accent">kein tracking</span> · Tippe <span class="accent">help</span> oder <span class="accent">ls</span>`);
        hr();
        line(`<span class="accent">Beispiel:</span> cd students`);
        line(``);
      };

      const help = () => {
        hr();
        line(`<span class="accent">Commands</span>`);
        line(`ls · cd &lt;dir&gt; · pwd · whoami · cat README · clear · help`);
        hr();
      };

      const catReadme = () => {
        line(`<span class="accent">README</span>`);
        line(`students   → Lehrplan + Unterrichtsbeispiele`);
        line(`colleagues → didaktische Kommentare + Material`);
        line(`cyber      → CyberDefense Lab + Writeups + Videos`);
        line(`events     → Lafferde Loop Challenge`);
      };

      const run = (raw) => {
        const cmdline = String(raw || "").trim();
        if(!cmdline) return;

        line(`<span class="ok">${esc(`ramon@school-lab:${state.cwd === "/" ? "~" : state.cwd}$`)}</span> ${esc(cmdline)}`);

        const [cmd, ...rest] = cmdline.split(/\s+/);
        const arg = rest.join(" ").trim();

        switch((cmd||"").toLowerCase()){
          case "ls":
            line(`<span class="accent">students/</span> colleagues/ cyber/ events/`);
            break;

          case "pwd":
            line(esc(state.cwd));
            break;

          case "whoami":
            line(`<span class="accent">Ramon Berghorn</span> — Informatik Sek I · CyberDefense Lab`);
            break;

          case "cat": {
            const t = (arg||"").toLowerCase();
            if(t === "readme" || t === "readme.txt") catReadme();
            else line(`<span class="warn">cat:</span> Datei nicht gefunden (Tipp: cat README)`);
            break;
          }

          case "cd": {
            const target = (arg||"").replaceAll("/","").toLowerCase();
            if(!target){ line(`<span class="warn">cd:</span> Ziel fehlt (Tipp: cd students)`); break; }
            if(!routes[target]){ line(`<span class="warn">cd:</span> unbekannt: ${esc(target)}`); break; }
            line(`<span class="accent">loading…</span>`);
            window.location.href = routes[target];
            break;
          }

          case "clear":
            out.innerHTML = "";
            break;

          case "help":
            help();
            break;

          default:
            line(`<span class="warn">command not found:</span> ${esc(cmd)} (Tipp: help)`);
        }
      };

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        run(input.value);
        input.value = "";
        input.focus();
      });

      miniHelp?.addEventListener("click", () => { help(); input.focus(); });

      motd();
      setPrompt();
      input.focus();
    })();
  </script>
</body>
</html>
