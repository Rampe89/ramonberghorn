<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ramon Berghorn — Informatik & CyberDefense Lab</title>
  <meta name="description" content="CyberDefense Lab, Unterrichtsbeispiele, schulinterner Lehrplan und Lernbuddy Informatik."/>

  <style>
    :root{
      --bg:#f6f4ef;
      --paper:#fffdf8;
      --ink:#111;
      --muted:#2f2f2f;
      --line:#111;

      --hi:#ff3b30;
      --hi2:#0057ff;
      --hi3:#00c853;

      --max: 1120px;
      --pad: 18px;
      --gap: 14px;
      --bw: 2px;

      --shadowInk: rgba(17,17,17,.95);
      --shadow: 10px 10px 0 var(--shadowInk);
      --shadow2: 6px 6px 0 var(--shadowInk);

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;

      --termBg:#070707;
      --termPanel:#0f0f0f;
      --termText:#e9e9e9;
      --termAccent:#7dd3fc;
      --termOk:#86efac;
      --termWarn:#ff7a70;
      --termGlow: rgba(134,239,172,.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--ink);
      background:
        linear-gradient(0deg, rgba(0,0,0,.05) 1px, transparent 1px) 0 0/ 22px 22px,
        linear-gradient(90deg, rgba(0,0,0,.05) 1px, transparent 1px) 0 0/ 22px 22px,
        var(--bg);
    }
    a{ color:inherit; }
    .wrap{ max-width: var(--max); margin:0 auto; padding: 0 var(--pad); }

    /* Top strip */
    .strip{
      background: var(--ink);
      color: var(--paper);
      border-bottom: var(--bw) solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing:.06em;
    }
    .strip .wrap{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px var(--pad);
    }
    .strip b{ font-weight:800; }
    .strip span{ opacity:.85; }

    /* Header */
    header{
      position:sticky;
      top:0;
      z-index:50;
      background: rgba(246,244,239,.92);
      backdrop-filter: blur(6px);
      border-bottom: var(--bw) solid var(--line);
    }
    .nav{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 12px 0;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:flex-start;
      gap:12px;
      min-width: 260px;
    }
    .mark{
      width:44px;height:44px;
      border: var(--bw) solid var(--line);
      background: var(--paper);
      display:grid;
      place-items:center;
      font-weight:900;
      user-select:none;
      box-shadow: var(--shadow2);
    }
    .brandText b{
      display:block;
      font-weight:900;
      letter-spacing:.01em;
      font-size: 14px;
      text-transform:uppercase;
    }
    .brandText span{
      display:block;
      font-size: 12px;
      font-family: var(--mono);
      color: var(--muted);
      margin-top:2px;
    }
    .menu{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    .tab{
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      border: var(--bw) solid var(--line);
      background: var(--paper);
      text-decoration:none;
      box-shadow: 4px 4px 0 var(--shadowInk);
      transition: transform .12s ease;
      text-transform:uppercase;
      letter-spacing:.06em;
      white-space:nowrap;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .tab:hover{ transform: translate(-2px, -2px); }

    main{ padding: 18px 0 34px; }

    /* Single column hero block */
    .panel{
      border: var(--bw) solid var(--line);
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .heroTop{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }
    .kicker{
      display:inline-flex;
      gap:10px;
      align-items:center;
      font-family: var(--mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing:.10em;
      padding: 8px 10px;
      border: var(--bw) solid var(--line);
      background: #fff;
      box-shadow: 4px 4px 0 var(--shadowInk);
    }
    .dot{
      width:10px;height:10px;
      background: var(--hi3);
      border: var(--bw) solid var(--line);
    }
    h1{
      margin: 6px 0 0;
      font-size: clamp(30px, 3.6vw, 54px);
      line-height:1.0;
      letter-spacing:-0.03em;
      font-weight: 900;
      text-transform:uppercase;
    }

    /* Big video */
    .videoFrame{
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding: 10px;
    }
    .videoHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom: 10px;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      flex-wrap:wrap;
    }
    .videoBtn{
      border: var(--bw) solid var(--line);
      padding: 4px 8px;
      box-shadow: 3px 3px 0 var(--shadowInk);
      background: #fff;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      cursor:pointer;
      white-space:nowrap;
    }
    .videoWrap{
      position:relative;
      width:100%;
      aspect-ratio: 16 / 9;
      border: var(--bw) solid var(--line);
      box-shadow: 4px 4px 0 var(--shadowInk);
      overflow:hidden;
      background:#000;
    }
    .videoWrap video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      background:#000;
    }

    /* Console */
    .consolePanel{
      margin-top: 14px;
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: var(--shadow2);
      padding: 10px;
    }
    .termTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 12px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .miniHelp{
      font-family: var(--mono);
      font-size: 12px;
      border: var(--bw) solid var(--line);
      background:#fff;
      box-shadow: 3px 3px 0 var(--shadowInk);
      padding: 6px 8px;
      white-space:nowrap;
      cursor:pointer;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .termBox{
      border: var(--bw) solid var(--line);
      box-shadow: 4px 4px 0 var(--shadowInk);
      background: var(--termBg);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 300px;
      position:relative;
    }
    /* subtle CRT */
    .termBox::before{
      content:"";
      position:absolute; inset:0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,.05) 0px,
        rgba(255,255,255,.05) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 7px
      );
      opacity:.18;
      pointer-events:none;
      mix-blend-mode: soft-light;
    }
    .termBox::after{
      content:"";
      position:absolute; inset:-40px;
      background: radial-gradient(closest-side, rgba(134,239,172,.10), transparent 62%);
      opacity:.55;
      pointer-events:none;
    }
    .termOut{
      padding: 12px;
      color: var(--termText);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      white-space:pre-wrap;
      flex:1;
      overflow:auto;
      position:relative;
      text-shadow: 0 0 14px var(--termGlow);
    }
    .termOut .accent{ color: var(--termAccent); font-weight:700; }
    .termOut .ok{ color: var(--termOk); font-weight:800; }
    .termOut .warn{ color: var(--termWarn); font-weight:800; }
    .termOut .pix{
      display:block;
      font-size: 10px;
      line-height: 1.2;
      letter-spacing: .03em;
      color:#c7ffdf;
      opacity:.95;
      margin: 0 0 8px;
    }
    .termInRow{
      display:flex;
      gap:8px;
      padding: 12px;
      border-top: 2px solid #111;
      background: var(--termPanel);
      align-items:center;
    }
    .prompt{
      color: var(--termOk);
      font-family: var(--mono);
      font-size: 12px;
      white-space:nowrap;
    }
    .termIn{
      flex:1;
      border: 2px solid #111;
      background:#fff;
      font-family: var(--mono);
      font-size: 12px;
      padding: 6px 8px;
    }

    @media (prefers-reduced-motion: reduce){
      .tab{ transition:none; }
      .tab:hover{ transform:none; }
    }
  </style>
</head>

<body>
  <div class="strip" aria-hidden="true">
    <div class="wrap">
      <div><b>RB</b> / Informatik Sek I / CyberDefense Lab</div>
      <div><span>BUILD:</span> <b>2025-12-29</b></div>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="nav">
        <div class="brand">
          <div class="mark" aria-hidden="true">RB</div>
          <div class="brandText">
            <b>Ramon Berghorn</b>

  <main>
    <div class="wrap">

      <section class="panel" aria-label="Landing">
        <div class="heroTop">
          <div class="kicker"><span class="dot"></span><span>unterricht · informatik · praxis</span></div>
          <h1>Informatik, die wirkt.</h1>
        </div>

        <!-- BIG HERO VIDEO (full width) -->
        <div class="videoFrame" aria-label="Hero Video">
          <div class="videoHead">
            <div>Hero Video</div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <button class="videoBtn" id="vidToggle" type="button">Pause</button>
              <button class="videoBtn" id="muteToggle" type="button">Unmute</button>
            </div>
          </div>
          <div class="videoWrap">
            <video autoplay controls id="heroVideo" loop muted playsinline poster="/assets/video/hero-poster.jpg" preload="metadata">

            <form class="termInRow" id="shellForm">
              <span class="prompt" id="promptText">ramon@school-lab:~$</span>
              <input class="termIn" id="shellIn" type="text" autocomplete="off" spellcheck="false"
                     placeholder="ls · cd students · help · tree · find flag" aria-label="Terminal Eingabe"/>

    </div>
  </main>

  <script>
    // Video controls
    (function(){
      const v = document.getElementById("heroVideo");
      const btnPlay = document.getElementById("vidToggle");
      const btnMute = document.getElementById("muteToggle");
      if(!v) return;

      const sync = () => {
        if(btnMute) btnMute.textContent = v.muted ? "Unmute" : "Mute";
        if(btnPlay) btnPlay.textContent = v.paused ? "Play" : "Pause";
      };

      const tryPlay = () => {
        const p = v.play();
        if(p && typeof p.catch === "function") p.catch(() => {});
      };

      btnPlay?.addEventListener("click", () => { v.paused ? tryPlay() : v.pause(); sync(); });
      btnMute?.addEventListener("click", () => { v.muted = !v.muted; if(!v.muted && v.paused) tryPlay(); sync(); });

      v.addEventListener("play", sync);
      v.addEventListener("pause", sync);
      v.addEventListener("volumechange", sync);
      window.addEventListener("load", () => { tryPlay(); sync(); });
      document.addEventListener("visibilitychange", () => { if(!document.hidden) tryPlay(); });
    })();

    // Terminal (rb-shell v2)
    (() => {
      const out = document.getElementById("shellOut");
      const form = document.getElementById("shellForm");
      const input = document.getElementById("shellIn");
      const promptText = document.getElementById("promptText");
      const miniHelp = document.getElementById("miniHelp");
      if(!out || !form || !input || !promptText) return;

      // Map "sections" to real pages (what cd/open can navigate to)
      const routes = {
        students: "/students/index.html",
        colleagues: "/colleagues/index.html",
        cyber: "/cyber/index.html",
        ultra: "/ultra/index.html"
      };

      // In-memory filesystem (toy)
      // Directories end with "/" in tree output; content stored as strings.
      // Hidden material is inside ".lab/" (discoverable via ls -a, tree -a, find).
      const fs = {
        "/": { type:"dir", kids:["students","colleagues","cyber","ultra","README","notes.txt",".lab"] },

        "/students": { type:"dir", kids:["README","aufgaben","beispiele"] },
        "/students/README": { type:"file", data:
`STUDENTS
- Lehrplan (Sek I)
- Unterrichtsbeispiele
- Aufgaben / Arbeitsblätter

Tipp: cd /students
`},
        "/students/aufgaben": { type:"dir", kids:["todo.txt"] },
        "/students/aufgaben/todo.txt": { type:"file", data:
`TODO (Beispiele)
- Scratch: Mini-Game
- Python: Datentypen + Schleifen
- HTML/CSS: Landingpage
`},
        "/students/beispiele": { type:"dir", kids:["netze.md","daten.md"] },
        "/students/beispiele/netze.md": { type:"file", data:
`Netze (Sek I)
- IP / Subnetz (intuition)
- Router vs Switch
- DNS als Telefonbuch
`},
        "/students/beispiele/daten.md": { type:"file", data:
`Daten
- Binär / Hex (praxisnah)
- Verschlüsselung vs Hashing
- Datenbanken: Tabellen + Schlüssel
`},

        "/colleagues": { type:"dir", kids:["README","didaktik.md","material.md"] },
        "/colleagues/README": { type:"file", data:
`COLLEAGUES
- Didaktische Kommentare
- Material-Übersichten
- Workshops / Fortbildung

Tipp: open colleagues
`},
        "/colleagues/didaktik.md": { type:"file", data:
`Didaktik (Kurz)
- Kompetenzorientiert, aber pragmatisch
- Output-Orientierung: Projekte > Folien
- Sicherheit/Datenschutz: "so viel wie nötig"
`},
        "/colleagues/material.md": { type:"file", data:
`Material
- Vorlagen (Arbeitsblatt, Checklisten)
- Bewertungsraster
- Tools: lokal / schulkonform
`},

        "/cyber": { type:"dir", kids:["README","writeups","lab"] },
        "/cyber/README": { type:"file", data:
`CYBERSECURITY
- CyberDefense Lab
- Writeups & Demos
- Grundlagen + verantwortungsbewusste Praxis

Hinweis: Dieses Terminal ist nur Deko. Keine echten Exploits.
`},
        "/cyber/writeups": { type:"dir", kids:["index.txt"] },
        "/cyber/writeups/index.txt": { type:"file", data:
`Writeups (Beispiele)
- Recon 101
- Web Basics
- Auth & Sessions
`},
        "/cyber/lab": { type:"dir", kids:["blue.md","red.md"] },
        "/cyber/lab/blue.md": { type:"file", data:
`Blue Team
- Logging/Monitoring
- Detection Basics
- Incident Notes
`},
        "/cyber/lab/red.md": { type:"file", data:
`Red Team (Education)
- Threat modeling
- OWASP Top 10 (high level)
- Hands-on: sichere Übungsumgebungen
`},

        "/ultra": { type:"dir", kids:["README","training","events"] },
        "/ultra/README": { type:"file", data:
`ULTRALAUFEN
- Training / Mindset
- Projekte (z.B. Shin-Gōka)
- Events & Orga
`},
        "/ultra/training": { type:"dir", kids:["plan.md","mindset.md"] },
        "/ultra/training/plan.md": { type:"file", data:
`Training (Skizze)
- Base
- Tempo / Strides
- Longrun + Back-to-Back
- Recovery als Pflicht
`},
        "/ultra/training/mindset.md": { type:"file", data:
`Mindset
- "Es ist alles gut" Check-in
- Moment erleben
- Wellen kommen, Wellen gehen
`},
        "/ultra/events": { type:"dir", kids:["lafferde.md"] },
        "/ultra/events/lafferde.md": { type:"file", data:
`Events
- Lafferde Loop Challenge
- Humble Club Backyard (Orga)
`},

        "/README": { type:"file", data:
`README
students   → Lehrplan + Unterrichtsbeispiele
colleagues → didaktische Kommentare + Material
cyber      → CyberDefense Lab + Writeups + Videos
ultra      → Ultralaufen / Training / Projekte

Tipp: ls, cd students, tree, find flag
`},
        "/notes.txt": { type:"file", data:
`NOTES
- kein tracking
- statisch hostbar
- Terminal ist "spielbar" und bewusst harmlos
`},

        // Hidden lab area (discoverable)
        "/.lab": { type:"dir", kids:[".cache","ops"] },
        "/.lab/.cache": { type:"dir", kids:["hint.txt"] },
        "/.lab/.cache/hint.txt": { type:"file", data:
`HINT
- try: ls -a
- try: tree -a
- try: find flag
`},
        "/.lab/ops": { type:"dir", kids:["flag.txt"] },
        "/.lab/ops/flag.txt": { type:"file", data:
`FLAG
RB{terminal_mode_unlocked}
`},
      };

      const state = {
        cwd: "/",
        user: "ramon",
        host: "school-lab",
        startTs: Date.now(),
        history: [],
        histIdx: -1,
        completions: [],
        compIdx: 0
      };

      const esc = (s) => String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
      const line = (html="") => { out.innerHTML += html + "<br>"; out.scrollTop = out.scrollHeight; };
      const hr = () => line(`<span class="accent">${"—".repeat(56)}</span>`);

      const normPath = (p) => {
        if(!p) return state.cwd;
        // absolute?
        let path = p.startsWith("/") ? p : (state.cwd === "/" ? `/${p}` : `${state.cwd}/${p}`);
        // remove duplicate slashes
        path = path.replace(/\/+/g,"/");
        // resolve . and ..
        const parts = [];
        for(const seg of path.split("/")){
          if(!seg || seg === ".") continue;
          if(seg === ".."){ parts.pop(); continue; }
          parts.push(seg);
        }
        return "/" + parts.join("/");
      };

      const isDir = (path) => fs[path]?.type === "dir";
      const isFile = (path) => fs[path]?.type === "file";

      const listDir = (path, showAll=false) => {
        const node = fs[path];
        if(!node || node.type !== "dir") return null;
        const kids = node.kids.slice();
        return kids.filter(k => showAll ? true : !k.startsWith("."));
      };

      const readFile = (path) => fs[path]?.type === "file" ? fs[path].data : null;

      const setPrompt = () => {
        const where = state.cwd === "/" ? "~" : state.cwd;
        promptText.textContent = `${state.user}@${state.host}:${where}$`;
      };

      const header = () => {
        line(`<span class="pix">┌─ rb-shell ───────────────────────────────────┐</span>`);
        line(`<span class="pix">│ dirs: students · colleagues · cyber · ultra │</span>`);
        line(`<span class="pix">└─────────────────────────────────────────────┘</span>`);
      };

      const motd = () => {
        out.innerHTML = "";
        header();
        line(`<span class="ok">OK</span> <span class="accent">kein tracking</span> · Tippe <span class="accent">help</span> oder <span class="accent">ls</span>`);
        hr();
        line(`<span class="accent">Beispiel:</span> cd students`);
        line(`<span class="accent">Challenge:</span> finde die versteckte flag (Tipp: find flag)`);
        line(``);
      };

      const help = () => {
        hr();
        line(`<span class="accent">Commands</span>`);
        line(`ls [-a] · cd &lt;dir&gt; · pwd · whoami · cat &lt;file&gt; · echo ... · clear`);
        line(`date · uptime · neofetch · tree [-a] · find &lt;term&gt; · grep &lt;term&gt; &lt;file&gt;`);
        line(`head [-n N] &lt;file&gt; · tail [-n N] &lt;file&gt; · open &lt;section&gt;`);
        line(`mkdir &lt;dir&gt; · touch &lt;file&gt; (nur /tmp)`);
        hr();
      };

      const man = (topic="") => {
        const t = (topic||"").toLowerCase();
        hr();
        if(!t){
          line(`<span class="accent">man</span> topic fehlt (z.B. man ls)`);
          hr();
          return;
        }
        const pages = {
          ls: "ls [-a]\nListet Verzeichnisse. -a zeigt auch dotfiles.",
          cd: "cd <dir>\nWechselt das Verzeichnis. Unterstützt .. und absolute Pfade.",
          tree: "tree [-a]\nZeigt Verzeichnisbaum. -a zeigt dotfiles.",
          find: "find <term>\nSucht Pfade im Dateibaum (substring match).",
          grep: "grep <term> <file>\nSucht in Datei nach Zeilen, die <term> enthalten.",
          open: "open <section>\nÖffnet Seite: students|colleagues|cyber|ultra"
        };
        line(`<span class="accent">MAN ${esc(t)}</span>`);
        line(esc(pages[t] || "Keine manpage gefunden."));
        hr();
      };

      const doTree = (base, showAll=false, prefix="") => {
        const node = fs[base];
        if(!node || node.type !== "dir") return;
        const kids = listDir(base, showAll) || [];
        kids.forEach((k, idx) => {
          const isLast = idx === kids.length - 1;
          const branch = isLast ? "└── " : "├── ";
          const nextPrefix = prefix + (isLast ? "    " : "│   ");
          const full = (base === "/" ? `/${k}` : `${base}/${k}`).replace(/\/+/g,"/");
          const label = fs[full]?.type === "dir" ? `<span class="accent">${esc(k)}/</span>` : esc(k);
          line(`${esc(prefix + branch)}${label}`);
          if(fs[full]?.type === "dir") doTree(full, showAll, nextPrefix);
        });
      };

      const doFind = (term) => {
        const q = (term||"").toLowerCase();
        const hits = [];
        for(const p of Object.keys(fs)){
          if(p.toLowerCase().includes(q)) hits.push(p);
        }
        hits.sort();
        if(!hits.length){
          line(`<span class="warn">find:</span> nichts gefunden`);
          return;
        }
        hits.slice(0, 80).forEach(h => line(esc(h)));
        if(hits.length > 80) line(`<span class="accent">…</span> (${hits.length-80} weitere Treffer)`);
      };

      const doGrep = (term, filePath) => {
        const p = normPath(filePath);
        const data = readFile(p);
        if(data == null){
          line(`<span class="warn">grep:</span> Datei nicht gefunden: ${esc(filePath)}`);
          return;
        }
        const q = (term||"").toLowerCase();
        const lines = String(data).split("\n");
        const hits = lines.filter(L => L.toLowerCase().includes(q));
        if(!hits.length){
          line(`<span class="warn">grep:</span> keine Treffer`);
          return;
        }
        hits.slice(0, 60).forEach(h => line(esc(h)));
        if(hits.length > 60) line(`<span class="accent">…</span> (${hits.length-60} weitere Zeilen)`);
      };

      const doHeadTail = (filePath, n=10, mode="head") => {
        const p = normPath(filePath);
        const data = readFile(p);
        if(data == null){
          line(`<span class="warn">${mode}:</span> Datei nicht gefunden: ${esc(filePath)}`);
          return;
        }
        const arr = String(data).split("\n");
        const slice = mode === "head" ? arr.slice(0, n) : arr.slice(Math.max(0, arr.length - n));
        slice.forEach(l => line(esc(l)));
      };

      const neofetch = () => {
        const up = Math.max(0, Math.floor((Date.now()-state.startTs)/1000));
        const mins = Math.floor(up/60);
        const secs = up%60;
        hr();
        line(`<span class="accent">rb@school-lab</span>`);
        line(`OS: RB Static (educational shell)`);
        line(`Shell: rb-shell`);
        line(`Uptime: ${mins}m ${secs}s`);
        line(`Sections: students, colleagues, cyber, ultra`);
        hr();
      };

      // Completion helpers
      const cmdList = [
        "ls","cd","pwd","whoami","cat","echo","clear","help","man",
        "date","uptime","neofetch","tree","find","grep","head","tail","open","mkdir","touch"
      ];

      const pathCompletions = (partial) => {
        const base = partial.includes("/") ? partial.slice(0, partial.lastIndexOf("/")) : "";
        const frag = partial.includes("/") ? partial.slice(partial.lastIndexOf("/")+1) : partial;
        const basePath = partial.startsWith("/") ? (base || "/") : normPath(base || ".");
        const dirPath = isDir(basePath) ? basePath : state.cwd;
        const kids = listDir(dirPath, true) || [];
        const results = kids
          .filter(k => k.toLowerCase().startsWith(frag.toLowerCase()))
          .map(k => {
            const full = (dirPath === "/" ? `/${k}` : `${dirPath}/${k}`).replace(/\/+/g,"/");
            const suffix = fs[full]?.type === "dir" ? "/" : "";
            if(partial.startsWith("/")){
              const prefix = (basePath === "/" ? "/" : basePath + "/");
              return (prefix + k + suffix).replace(/\/+/g,"/");
            }
            // relative
            const relPrefix = base ? (base.endsWith("/") ? base : base + "/") : "";
            return relPrefix + k + suffix;
          });
        return results;
      };

      const printPrompted = (cmdline) => {
        const where = state.cwd === "/" ? "~" : state.cwd;
        line(`<span class="ok">${esc(`${state.user}@${state.host}:${where}$`)}</span> ${esc(cmdline)}`);
      };

      const run = (raw) => {
        const cmdline = String(raw || "").trim();
        if(!cmdline) return;

        // history
        state.history.push(cmdline);
        state.histIdx = state.history.length;

        printPrompted(cmdline);

        const parts = cmdline.split(/\s+/);
        const cmd = (parts.shift() || "").toLowerCase();
        const rest = parts;

        const argLine = rest.join(" ").trim();

        switch(cmd){
          case "ls": {
            const showAll = rest.includes("-a") || rest.includes("--all");
            const target = rest.find(x => !x.startsWith("-"));
            const p = target ? normPath(target) : state.cwd;
            const kids = listDir(p, showAll);
            if(!kids){ line(`<span class="warn">ls:</span> kein verzeichnis: ${esc(target||state.cwd)}`); break; }
            const rendered = kids.map(k => {
              const full = (p === "/" ? `/${k}` : `${p}/${k}`).replace(/\/+/g,"/");
              if(fs[full]?.type === "dir") return `<span class="accent">${esc(k)}/</span>`;
              return esc(k);
            }).join(" ");
            line(rendered || "");
            break;
          }

          case "pwd":
            line(esc(state.cwd));
            break;

          case "whoami":
            line(`<span class="accent">Ramon Berghorn</span> — Informatik Sek I · CyberDefense Lab`);
            break;

          case "date":
            line(esc(new Date().toString()));
            break;

          case "uptime": {
            const up = Math.max(0, Math.floor((Date.now()-state.startTs)/1000));
            const mins = Math.floor(up/60);
            const secs = up%60;
            line(`${mins}m ${secs}s`);
            break;
          }

          case "neofetch":
            neofetch();
            break;

          case "cat": {
            if(!argLine){ line(`<span class="warn">cat:</span> Datei fehlt (z.B. cat README)`); break; }
            const p = normPath(argLine.replace(/^["']|["']$/g,""));
            const data = readFile(p);
            if(data == null){ line(`<span class="warn">cat:</span> Datei nicht gefunden: ${esc(argLine)}`); break; }
            String(data).split("\n").forEach(l => line(esc(l)));
            break;
          }

          case "echo":
            line(esc(argLine));
            break;

          case "clear":
            out.innerHTML = "";
            break;

          case "help":
            help();
            break;

          case "man":
            man(rest[0] || "");
            break;

          case "tree": {
            const showAll = rest.includes("-a") || rest.includes("--all");
            const target = rest.find(x => !x.startsWith("-"));
            const p = target ? normPath(target) : state.cwd;
            if(!isDir(p)){ line(`<span class="warn">tree:</span> kein verzeichnis: ${esc(target||state.cwd)}`); break; }
            line(`<span class="accent">${esc(p === "/" ? "." : p)}</span>`);
            doTree(p, showAll, "");
            break;
          }

          case "find": {
            if(!argLine){ line(`<span class="warn">find:</span> term fehlt (z.B. find flag)`); break; }
            doFind(argLine);
            break;
          }

          case "grep": {
            if(rest.length < 2){ line(`<span class="warn">grep:</span> usage: grep &lt;term&gt; &lt;file&gt;`); break; }
            const term = rest[0];
            const filePath = rest.slice(1).join(" ");
            doGrep(term, filePath);
            break;
          }

          case "head":
          case "tail": {
            let n = 10;
            let i = 0;
            if(rest[i] === "-n" && rest[i+1]){
              const parsed = parseInt(rest[i+1],10);
              if(Number.isFinite(parsed) && parsed > 0) n = parsed;
              i += 2;
            }
            const filePath = rest.slice(i).join(" ");
            if(!filePath){ line(`<span class="warn">${cmd}:</span> usage: ${cmd} [-n N] &lt;file&gt;`); break; }
            doHeadTail(filePath, n, cmd);
            break;
          }

          case "cd": {
            if(!argLine){ state.cwd = "/"; setPrompt(); break; }
            const target = argLine.replace(/^["']|["']$/g,"");
            const p = normPath(target);
            if(!isDir(p)){ line(`<span class="warn">cd:</span> kein verzeichnis: ${esc(target)}`); break; }
            state.cwd = p;
            setPrompt();
            break;
          }

          case "open": {
            const target = (argLine||"").toLowerCase().trim();
            if(!target){ line(`<span class="warn">open:</span> Ziel fehlt (students|colleagues|cyber|ultra)`); break; }
            if(!routes[target]){ line(`<span class="warn">open:</span> unbekannt: ${esc(target)}`); break; }
            line(`<span class="accent">loading…</span>`);
            window.location.href = routes[target];
            break;
          }

          case "mkdir":
          case "touch": {
            // intentionally limited (keine echte persistenz, keine manipulation außerhalb /tmp)
            line(`<span class="warn">${cmd}:</span> deaktiviert (demo-shell, read-only)`);
            break;
          }

          default:
            line(`<span class="warn">command not found:</span> ${esc(cmd)} (Tipp: help)`);
        }
      };

      // Input handlers: submit + history + tab completion
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        run(input.value);
        input.value = "";
        state.completions = [];
        state.compIdx = 0;
        input.focus();
      });

      input.addEventListener("keydown", (e) => {
        // history up/down
        if(e.key === "ArrowUp"){
          e.preventDefault();
          if(state.history.length === 0) return;
          state.histIdx = Math.max(0, state.histIdx - 1);
          input.value = state.history[state.histIdx] || "";
          return;
        }
        if(e.key === "ArrowDown"){
          e.preventDefault();
          if(state.history.length === 0) return;
          state.histIdx = Math.min(state.history.length, state.histIdx + 1);
          input.value = state.histIdx === state.history.length ? "" : (state.history[state.histIdx] || "");
          return;
        }

        // Tab completion
        if(e.key === "Tab"){
          e.preventDefault();
          const v = input.value;
          const parts = v.split(/\s+/);
          const last = parts[parts.length-1] || "";
          const isFirst = parts.length === 1;

          if(isFirst){
            // complete command
            if(!state.completions.length || !v.endsWith(state.completions[state.compIdx] || "")){
              const m = cmdList.filter(c => c.startsWith(last.toLowerCase()));
              state.completions = m;
              state.compIdx = 0;
            }
            if(state.completions.length){
              const cand = state.completions[state.compIdx % state.completions.length];
              input.value = cand;
              state.compIdx++;
            }
            return;
          } else {
            // complete path/sections
            const comps = pathCompletions(last);
            if(!comps.length) return;
            if(state.completions.join("|") !== comps.join("|")){
              state.completions = comps;
              state.compIdx = 0;
            }
            const cand = state.completions[state.compIdx % state.completions.length];
            parts[parts.length-1] = cand;
            input.value = parts.join(" ");
            state.compIdx++;
          }
        }
      });

      miniHelp?.addEventListener("click", () => { help(); input.focus(); });

      motd();
      setPrompt();
      input.focus();
    })();
  </script>
</body>
</html>
